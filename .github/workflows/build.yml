name: Build & Inject MyPvPClient

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Xcode Environment
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'

    # Dobby'nin Hazır Başlık Dosyalarını ve Statik Kütüphanesini İndir
    - name: Download Prebuilt Dobby Framework
      run: |
        mkdir -p vendor
        git clone --depth 1 https://github.com/jmpews/Dobby.git vendor/dobby
        
        # iOS ARM64 için Dobby Statik Kütüphanesini CMake ile minimal Derle
        cd vendor/dobby
        mkdir build && cd build
        cmake .. \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_SYSROOT=iphoneos \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
          -DDOBBY_GENERATE_SHARED=OFF \
          -DDOBBY_BUILD_EXAMPLE=OFF \
          -DDOBBY_BUILD_TEST=OFF
        make -j$(sysctl -n hw.ncpu) dobby_static

    # C++ Kodumuzu Hazır Dobby İle Derle
    - name: Compile Dylib with Clang (ARM64 iOS)
      run: |
        mkdir -p build
        xcrun --sdk iphoneos clang++ -dynamiclib \
          -arch arm64 \
          -miphoneos-version-min=14.0 \
          -std=c++17 \
          -Ivendor/dobby/include \
          -Isrc \
          src/main.cpp src/XboxFix.cpp \
          vendor/dobby/build/libdobby.a \
          -framework Foundation -framework UIKit \
          -o build/MyPvPClient.dylib

    # Oluşan Dylib Dosyasını artifact Olarak Sun
    - name: Upload Dylib Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MyPvPClient-Dylib
        path: build/MyPvPClient.dylib
