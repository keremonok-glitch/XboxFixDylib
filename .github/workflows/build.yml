name: Build & Inject MyPvPClient

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Xcode Environment
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'

    - name: Clone Dobby Framework
      run: |
        mkdir -p vendor
        git clone --depth 1 https://github.com/jmpews/Dobby.git vendor/dobby

    - name: Compile Dylib with Clang (ARM64 iOS)
      run: |
        mkdir -p build
        xcrun --sdk iphoneos clang++ -dynamiclib \
          -arch arm64 \
          -miphoneos-version-min=14.0 \
          -std=c++17 \
          -Ivendor/dobby/include \
          -Isrc \
          src/main.cpp src/XboxFix.cpp \
          -framework Foundation -framework UIKit \
          -o build/MyPvPClient.dylib

    - name: Upload Dylib Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MyPvPClient-Dylib
        path: build/MyPvPClient.dylib
