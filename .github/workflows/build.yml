name: Build MyPvPClient

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Xcode Environment
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'

    # 1. Dobby Reposunu Çek
    - name: Clone Dobby Repo
      run: |
        mkdir -p vendor
        git clone --recursive --depth 1 https://github.com/jmpews/Dobby.git vendor/dobby

    # 2. Dobby'yi CMake ile Derle (En Sağlam Yöntem)
    - name: Build Dobby Library via CMake
      run: |
        mkdir -p vendor/dobby/build
        cd vendor/dobby/build
        cmake .. \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
          -DDOBBY_GENERATE_SHARED=OFF \
          -DCMAKE_BUILD_TYPE=Release
        make -j$(sysctl -n hw.ncpu)

    # 3. Kendi Dylib'ini Dobby ile Bağlayarak Derle
    - name: Compile MyPvPClient Dylib
      run: |
        mkdir -p build
        
        # src klasöründeki kendi .cpp ve .mm dosyalarını bul
        SRC_FILES=$(find src -name "*.cpp" -o -name "*.mm" -o -name "*.c")
        
        xcrun --sdk iphoneos clang++ -dynamiclib \
          -arch arm64 \
          -miphoneos-version-min=14.0 \
          -std=c++17 \
          -O2 \
          -Ivendor/dobby/include \
          -Ivendor/dobby/builtin-plugin/SymbolResolver \
          -Isrc \
          $SRC_FILES \
          vendor/dobby/build/libdobby.a \
          -framework Foundation -framework UIKit \
          -o build/MyPvPClient.dylib

    # 4. Çıktıyı Artifact Yap
    - name: Upload Dylib Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MyPvPClient-Dylib
        path: build/MyPvPClient.dylib
