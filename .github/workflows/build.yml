name: Build MyPvPClient

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Xcode Environment
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'

    # Dobby Kaynak Kodlarını Çek
    - name: Clone Dobby Repo
      run: |
        mkdir -p vendor
        git clone --depth 1 https://github.com/jmpews/Dobby.git vendor/dobby

    # Dobby'nin iOS ARM64 İçin Gerekli C/C++ Kodlarını Doğrudan Biz Derliyoruz
    - name: Compile Dylib (Standalone Build)
      run: |
        mkdir -p build
        xcrun --sdk iphoneos clang++ -dynamiclib \
          -arch arm64 \
          -miphoneos-version-min=14.0 \
          -std=c++17 \
          -O2 \
          -DDOBBY_DEBUG=0 \
          -Ivendor/dobby/include \
          -Ivendor/dobby/source \
          -Ivendor/dobby/builtin-plugin/SymbolResolver \
          -Isrc \
          src/main.cpp src/XboxFix.cpp \
          vendor/dobby/source/dobby.cpp \
          vendor/dobby/source/InterceptRouting/InterceptRouting.cpp \
          vendor/dobby/source/InterceptRouting/ExtraInternalPlugin/RegisterInspection/RegisterInspection.cpp \
          vendor/dobby/source/Backend/UserMode/ExecMemory/code-patch-tool-posix.cc \
          vendor/dobby/source/Backend/UserMode/ExecMemory/clear-cache-tool-all.c \
          vendor/dobby/source/Backend/UserMode/UnifiedInterface/platform-posix.cc \
          vendor/dobby/source/Backend/UserMode/PlatformUtil/Darwin/ProcessRuntime.cc \
          vendor/dobby/source/InstructionRelocation/arm64/InstructionRelocationARM64.cc \
          vendor/dobby/source/core/assembler/assembler-arm64.cc \
          vendor/dobby/source/core/codegen/codegen-arm64.cc \
          vendor/dobby/source/TrampolineBridge/ClosureTrampolineBridge/arm64/closure_bridge_arm64.cc \
          vendor/dobby/source/TrampolineBridge/ClosureTrampolineBridge/arm64/ClosureTrampolineARM64.cc \
          vendor/dobby/source/TrampolineBridge/ClosureTrampolineBridge/arm64/helper_arm64.cc \
          vendor/dobby/source/TrampolineBridge/Trampoline/trampoline_arm64.cc \
          vendor/dobby/source/InterceptRouting/NearBranchTrampoline/near_trampoline_arm64.cc \
          vendor/dobby/builtin-plugin/SymbolResolver/macho/dobby_symbol_resolver.cc \
          vendor/dobby/builtin-plugin/SymbolResolver/macho/macho_file_symbol_resolver.cpp \
          vendor/dobby/builtin-plugin/SymbolResolver/macho/shared_cache_ctx.cpp \
          -framework Foundation -framework UIKit \
          -o build/MyPvPClient.dylib

    # İndirilebilir Çıktı Oluştur
    - name: Upload Dylib Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MyPvPClient-Dylib
        path: build/MyPvPClient.dylib
